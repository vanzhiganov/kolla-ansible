[defaults]
# Collections and roles are installed system-wide at image build time.
collections_path = /usr/share/ansible/collections
roles_path = /usr/share/ansible/roles

# Target hosts may not have a python3 that matches ansible's expectations;
# let ansible discover it silently instead of emitting warnings.
interpreter_python = auto_silent

# Deployment runs are noisy enough without colour escapes in log captures.
force_color = False
